name: tests

on:
  push:
    branches: [main, harnesseed]
  pull_request:

jobs:
  harnesseed-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Manifest, hook, and invariants test suites
        run: bash tests/run-all.sh
      - name: Blueprint change requires plugin version bump
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bash tests/version-bump-check.sh "origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
            if [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git rev-parse -q --verify "$BASE^{commit}" >/dev/null; then
              BASE=origin/main
            fi
            bash tests/version-bump-check.sh "$BASE"
          fi
